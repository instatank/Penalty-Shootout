<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      maximum-scale + user-scalable=no: stop pinch-zoom fighting the swipe.
      viewport-fit=cover: draw under notches/safe areas for a full-bleed pitch.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b5d2b" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Penalty Shootout</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b5d2b;
        overflow: hidden;
        /* Disable text selection / long-press menus during rapid swiping. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* touch-action:none is architecture RULE 3 — it stops the browser from
         treating a swipe as scroll/pan/zoom so the game owns the gesture. */
      #game-container,
      #game-container canvas {
        touch-action: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
