<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      maximum-scale + user-scalable=no: stop pinch-zoom fighting the swipe.
      viewport-fit=cover: draw under notches/safe areas for a full-bleed pitch.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b5d2b" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Penalty Shootout</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b5d2b;
        overflow: hidden;
        /* Disable text selection / long-press menus during rapid swiping. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* touch-action:none is architecture RULE 3 — it stops the browser from
         treating a swipe as scroll/pan/zoom so the game owns the gesture. */
      #game-container,
      #game-container canvas {
        touch-action: none;
        display: block;
      }

      /* The game is landscape. If the phone is held portrait, hide the game and
         show a rotate prompt. (Full PWA orientation lock comes in Milestone 7;
         this is just a friendly nudge so testing feels right now.) */
      #rotate-hint {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #game-container {
          display: none;
        }
        #rotate-hint {
          display: flex;
          position: fixed;
          inset: 0;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          color: #f5f5f5;
          font-family: system-ui, -apple-system, sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate-hint .glyph {
          font-size: 64px;
          animation: rotate-nudge 1.8s ease-in-out infinite;
        }
      }
      @keyframes rotate-nudge {
        0%, 60% { transform: rotate(0deg); }
        80%, 100% { transform: rotate(90deg); }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="rotate-hint">
      <div class="glyph">📱</div>
      <div>Rotate your phone sideways to play</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
